version: 2

# Tests are shared through YAML anchors (&name / *name). Views in staging/ are not
# tested directly (it would rescan bronze every run): their output is tested in
# the intermediate tables.

models:
  # ---------------- silver / intermediate: one table per product ----------------
  - name: int_detections_sp
    description: Every SP detection (MODIS + 3 VIIRS satellites), latest version per detection_id. Invalid rows kept, flagged in dq_issue.
    data_tests: &detection_unique
      - unique_combination:
          arguments: {columns: [detection_id], recent_only: true}
    columns: &int_columns
      - name: dq_issue
        data_tests:
          - accepted_values:
              arguments: {values: [missing_key, invalid_coordinates, invalid_brightness, invalid_frp, invalid_confidence, invalid_daynight]}
      - name: product
        data_tests: [{accepted_values: {arguments: {values: [sp, nrt]}}}]
      - name: sensor
        data_tests: [{accepted_values: {arguments: {values: [modis, viirs]}}}]

  - name: int_detections_nrt
    description: Every NRT detection (MODIS + VIIRS satellites), latest version per detection_id. Invalid rows kept, flagged in dq_issue.
    data_tests: *detection_unique
    columns: *int_columns

  - name: int_static_sources
    description: Mask of static heat sources (res-8 cells + k=1 neighbours) built from SP non-vegetation detections on >= 2 days.
    columns:
      - name: h3_r8
        data_tests: [unique, not_null]
      - name: fire_type
        data_tests: [{accepted_values: {arguments: {values: [1, 2, 3], quote: false}}}]

  # ---------------- gold: everything about the hexagon (h3_r6) ----------------
  - name: dim_hexagon
    description: The canonical entity. One row per resolution-6 hexagon that ever had a detection.
    # Contract: the backend and other consumers rely on these columns and types.
    columns:
      - {name: h3_r6, data_type: ubigint, description: "H3 resolution-6 cell id. Fixed forever; h3_id is the same id as text.", data_tests: [unique, not_null]}
      - {name: h3_id, data_type: varchar}
      - {name: center_lat, data_type: double}
      - {name: center_lon, data_type: double}
      - {name: area_km2, data_type: double, description: "Real cell area (varies about ±20% with location); use it for densities.", data_tests: [not_null]}
      - {name: boundary_wkt, data_type: varchar}
      - {name: h3_r5, data_type: ubigint}
      - {name: h3_r4, data_type: ubigint}
      - {name: h3_r3, data_type: ubigint}
      - {name: first_date, data_type: date}
      - {name: last_date, data_type: date}
      - {name: fire_detections_total, data_type: bigint, description: Preferred rows only (SP + NRT not double counted).}
      - {name: static_detections_total, data_type: bigint}
      - {name: has_static_source, data_type: boolean}

  - name: fct_hexagon_detections
    description: >
      Detail of the hexagon: one row per valid detection, SP and NRT together.
      Filter is_preferred for one continuous series; is_static_source marks heat
      that is not a wildfire.
    data_tests:
      - unique_combination:
          arguments: {columns: [detection_id, product], recent_only: true}
    columns:
      - name: h3_r6
        data_tests: [not_null]
      - name: is_preferred
        data_tests: [not_null]
      - name: is_static_source
        data_tests: [not_null]
      - name: acq_datetime_utc
        data_tests: [not_null]
      - name: product
        data_tests: [{accepted_values: {arguments: {values: [sp, nrt]}}}]
      - name: sensor
        data_tests: [{accepted_values: {arguments: {values: [modis, viirs]}}}]
      - name: satellite
        description: Normalized from FIRMS codes (T/A/N/N20/N21).
        data_tests: [{accepted_values: {arguments: {values: [Terra, Aqua, S-NPP, NOAA-20, NOAA-21]}}}]
      - name: confidence_level
        description: low / nominal / high (MODIS <30 / 30-79 / >=80; VIIRS l / n / h).
        data_tests: [{accepted_values: {arguments: {values: [low, nominal, high]}}}]
      - name: fire_type
        description: SP `type` (0 vegetation, 1 volcano, 2 static land source, 3 offshore); null in NRT.
        data_tests: [{accepted_values: {arguments: {values: [0, 1, 2, 3], quote: false}}}]

  - name: fct_hexagon_daily
    description: >
      Metrics of the hexagon: hexagon x day x product x sensor x satellite x day/night.
      Fire metrics exclude static sources, which are counted apart. No row means
      "no detection", not "no fire".
    data_tests:
      - unique_combination:
          arguments:
            columns: [h3_r6, acq_date, product, sensor, satellite, daynight]
            recent_only: true
            load_col: last_load_id
    # Contract: the backend and other consumers rely on these columns and types.
    columns:
      - name: h3_r6
        data_type: ubigint
        data_tests:
          - not_null
          - relationships:
              arguments: {to: ref('dim_hexagon'), field: h3_r6}
      - {name: acq_date, data_type: date}
      - {name: acq_month, data_type: date}
      - {name: product, data_type: varchar}
      - {name: sensor, data_type: varchar}
      - {name: satellite, data_type: varchar}
      - {name: daynight, data_type: varchar, data_tests: [{accepted_values: {arguments: {values: [D, N]}}}]}
      - {name: is_preferred, data_type: boolean}
      - {name: fire_detections, data_type: bigint}
      - {name: fire_frp_sum, data_type: double}
      - {name: fire_frp_max, data_type: double}
      - {name: fire_frp_mean, data_type: double}
      - {name: fire_high_conf, data_type: bigint}
      - {name: static_detections, data_type: bigint}
      - {name: static_frp_sum, data_type: double}
      - {name: last_load_id, data_type: varchar}

  - name: fct_hexagon_monthly
    description: >
      Monthly series of the hexagon on the continuous series (preferred rows):
      hexagon x month x sensor x satellite. Feeds per-hexagon charts and climatology.
    data_tests:
      - unique_combination:
          arguments:
            columns: [h3_r6, acq_month, sensor, satellite]
            recent_only: true
            load_col: last_load_id
    # Contract: the backend relies on these columns and types.
    columns:
      - name: h3_r6
        data_type: ubigint
        data_tests:
          - not_null
          - relationships:
              arguments: {to: ref('dim_hexagon'), field: h3_r6}
      - {name: acq_month, data_type: date}
      - {name: sensor, data_type: varchar}
      - {name: satellite, data_type: varchar}
      - {name: products, data_type: varchar, description: "Products in the month: sp, nrt or both (sp,nrt)."}
      - {name: fire_detections, data_type: bigint}
      - {name: fire_day, data_type: bigint}
      - {name: fire_night, data_type: bigint}
      - {name: fire_frp_sum, data_type: double}
      - {name: fire_frp_max, data_type: double}
      - {name: fire_high_conf, data_type: bigint}
      - {name: active_days, data_type: bigint}
      - {name: static_detections, data_type: bigint}
      - {name: last_load_id, data_type: varchar}

  - name: fct_hexagon_profile
    description: >
      Profile of the hexagon ("ficha técnica", whole history): one row per
      hexagon x sensor, precomputed on the continuous series. Recent activity is
      relative to data_end_date (the last day with data), not to today.
    data_tests:
      - unique_combination:
          arguments: {columns: [h3_r6, sensor]}
    # Contract: the backend relies on these columns and types.
    columns:
      - name: h3_r6
        data_type: ubigint
        data_tests:
          - not_null
          - relationships:
              arguments: {to: ref('dim_hexagon'), field: h3_r6}
      - {name: sensor, data_type: varchar, data_tests: [{accepted_values: {arguments: {values: [modis, viirs]}}}]}
      - {name: first_date, data_type: date}
      - {name: last_date, data_type: date}
      - {name: active_days, data_type: bigint}
      - {name: fire_detections, data_type: bigint}
      - {name: fire_frp_sum, data_type: double}
      - {name: fire_frp_max, data_type: double}
      - {name: fire_frp_mean, data_type: double}
      - {name: fire_frp_p90, data_type: double}
      - {name: high_conf_share, data_type: double}
      - {name: day_share, data_type: double}
      - {name: peak_date, data_type: date}
      - {name: peak_day_detections, data_type: bigint}
      - {name: peak_month, data_type: integer, description: "1-12, the month of the year with most detections."}
      - {name: climatology, data_type: "bigint[]", description: "Detections per month of the year, January to December."}
      - {name: last_7d, data_type: bigint}
      - {name: last_30d, data_type: bigint}
      - {name: data_end_date, data_type: date}
      - {name: static_detections, data_type: bigint}
      - {name: static_share, data_type: double}
      - {name: satellites, data_type: bigint}

  # ---------------- harmonized: one series across the MODIS -> VIIRS change ----------------
  - name: hrm_modis_merged
    description: >
      MODIS detections (preferred, non-static, confidence >= 30) with bow-tie duplicates merged into one row
      per fire pixel group, with size-corrected FRP. n_merged is how many raw detections each row stands for.
    columns:
      - {name: merged_id, data_tests: [unique, not_null]}
      - {name: h3_r6, data_tests: [not_null]}
      - {name: n_merged, data_tests: [not_null]}

  - name: fct_area_coverage_monthly
    description: >
      Per download area (bbox) and month: whether MODIS / VIIRS S-NPP cover every day (bronze request windows).
      Tells "no detection" from "no data": a hexagon-month without row is a zero only where this says complete.
    data_tests:
      - unique_combination:
          arguments: {columns: [area, acq_month]}
    columns:
      - {name: west, data_tests: [not_null]}
      - {name: modis_complete, data_tests: [not_null]}
      - {name: viirs_complete, data_tests: [not_null]}

  - name: hrm_cell_k
    description: k (VIIRS S-NPP / MODIS) of every hexagon from the frozen seed, own cell > nearest ancestor > global.
    columns:
      - {name: h3_r6, data_tests: [unique, not_null]}
      - {name: k_frp, data_tests: [not_null]}
      - {name: k_count, data_tests: [not_null]}

  - name: fct_hexagon_harmonized_daily
    description: >
      Map layer to compare MODIS and VIIRS in the same units (MODIS units): hexagon x day x day/night x sensor.
      MODIS merged and size-corrected; VIIRS S-NPP divided by the hexagon's k. Counts are fractional.
    data_tests:
      - unique_combination:
          arguments: {columns: [h3_r6, acq_date, daynight, sensor]}
    columns:
      - name: h3_r6
        data_tests:
          - not_null
          - relationships: {arguments: {to: ref('dim_hexagon'), field: h3_r6}}
      - {name: sensor, data_tests: [{accepted_values: {arguments: {values: [modis, viirs]}}}]}
      - {name: fire_detections, data_tests: [not_null]}
      - {name: fire_frp_sum, data_tests: [not_null]}

  - name: fct_hexagon_harmonized_monthly
    description: >
      One continuous monthly series per hexagon in MODIS units: MODIS (merged, size-corrected) before 2012-02,
      VIIRS S-NPP / k from 2012-02. k per cell from the frozen seed k_cell (k_res = level of the k used).
      No row means "no detection", not "no fire".
    data_tests:
      - unique_combination:
          arguments: {columns: [h3_r6, acq_month]}
    columns:
      - name: h3_r6
        data_tests:
          - not_null
          - relationships: {arguments: {to: ref('dim_hexagon'), field: h3_r6}}
      - {name: harmonized_source, data_tests: [{accepted_values: {arguments: {values: [modis, viirs]}}}]}
      - {name: detections_harmonized, data_tests: [not_null]}
      - {name: frp_harmonized, data_tests: [not_null]}
      - {name: k_frp, data_tests: [not_null]}
      - {name: k_count, data_tests: [not_null]}
      - name: k_res
        data_tests: [{accepted_values: {arguments: {values: [0, 2, 3, 4, 5, 6], quote: false}}}]

  - name: hrm_detection_reliability
    description: >
      Persistence (n_pairs, persistent) and reliability index of every wildfire detection (preferred row). reliability =
      probability that an independent sensor confirms it (logistic on confidence, persistence, FRP; seed reliability_model).
    data_tests:
      - unique_combination:
          arguments: {columns: [detection_id], recent_only: true, load_col: last_load_id}
    columns:
      - {name: h3_r6, data_tests: [not_null]}
      - {name: n_pairs, data_tests: [not_null]}
      - name: reliability
        data_tests: [not_null]

  - name: fct_hexagon_reliability_monthly
    description: "Per hexagon, month and sensor, the persistent share and the mean reliability index. No row means no detection."
    data_tests:
      - unique_combination:
          arguments: {columns: [h3_r6, acq_month, sensor]}
    columns:
      - name: h3_r6
        data_tests:
          - not_null
          - relationships: {arguments: {to: ref('dim_hexagon'), field: h3_r6}}
      - {name: reliability_mean, data_tests: [not_null]}

seeds:
  - name: k_cell
    description: >
      Frozen cross-sensor factor k = VIIRS S-NPP / MODIS (Terra + Aqua, bow-tie merged, size-corrected) per H3 cell,
      for FRP (k_frp) and detection counts (k_count). Rows: `global` (res 0) and every cell r2..r6 that had data.
      Hierarchical shrinkage: log k of a cell is pulled to its parent with weight n/(n+100), n = MODIS detections.
      Calibrated on 2013-2025, months with complete MODIS and S-NPP downloads (fct_area_coverage_monthly), in the 4 areas that have them (delta, Iberá, Zambia, AR_north); chosen by year-parity
      cross-validation (r6 alone is worse than a global k; shrinkage halves the error in active cells).
      Generated by data_exploration/k_cell/ on 2026-11-15; not meant to change: a new calibration is a new seed version.
    columns:
      - {name: h3, data_tests: [not_null]}
      - name: res
        data_tests: [{accepted_values: {arguments: {values: [0, 2, 3, 4, 5, 6], quote: false}}}]
      - {name: k_frp, data_tests: [not_null]}
      - {name: k_count, data_tests: [not_null]}
    data_tests:
      - unique_combination:
          arguments: {columns: [h3, res]}

  - name: reliability_model
    description: >
      Frozen logistic model of the reliability index, one row per sensor (intercept, b_conf, b_pairs, b_lfrp). Fitted on the
      2019 windows of 25 regions by data_exploration/reliability/reliability_fit.py (out-of-fold AUC by region: MODIS 0.66, VIIRS
      0.73). The `viirs` row was trained on S-NPP and is applied to every VIIRS satellite; `modis` on Aqua, applied to Terra too.
    columns:
      - {name: sensor, data_tests: [unique, not_null, {accepted_values: {arguments: {values: [modis, viirs]}}}]}
