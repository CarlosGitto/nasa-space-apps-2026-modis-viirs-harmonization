name: firms
version: "1.0.0"
profile: firms

model-paths: ["models"]
macro-paths: ["macros"]

# Layers (all in the DuckLake attached as `lake`, see profiles.yml):
#
#   bronze   lake.firms_raw.*        dlt, append-only (sources.yml)
#            lake.weather_raw.*      dlt, append-only: NASA POWER daily weather near fires
#   silver   staging/                one view per bronze table: cleaning, types,
#                                    dq_issue, origin columns, hexagon (h3_r6)
#            intermediate/           one table per product (SP, NRT): satellites
#                                    unioned, latest version per detection;
#                                    plus the static-source mask
#   gold     gold/                   everything about the hexagon, the canonical
#                                    entity: dim_hexagon, fct_hexagon_detections
#                                    (detail), fct_hexagon_daily (metrics)
#                                    plus weather per grid cell and day near fires:
#                                    fct_weather_daily (NASA POWER)
#
# Incremental models recompute only the acquisition months whose newest load is newer than what the model has for that
# month, at most `firms_months_per_run` (default 1) per run, oldest first (macros/incremental.sql, pending_months_scope):
# a backlog (a long backfill landing before dbt, or dbt failing for a while) is worked through in steps that fit in memory
# and the rest stays pending until the next run. `dbt build --full-refresh` also builds only the oldest months of those models.
#
# Airflow (Cosmos) runs `tag:sp+` after SP loads, `tag:nrt+` after NRT loads and
# `tag:weather+` after weather loads: each branch plus everything downstream (gold).
# The weather branch doesn't touch the fire models and vice versa.
models:
  firms:
    +database: lake
    staging:
      +schema: silver
      +materialized: view
    intermediate:
      +schema: silver
    gold:
      +schema: gold
    harmonized:
      +schema: gold
      +tags: ['harmonized']  # built by the firms_dbt_harmonize DAG, not by firms_dbt_sp / firms_dbt_nrt

# k = VIIRS / MODIS per H3 cell, frozen (see seeds/k_cell.csv, schema.yml).
seeds:
  firms:
    +database: lake
    +schema: gold
    +tags: ['harmonized']
    k_cell:
      +column_types: {h3: varchar, res: integer, n_modis: bigint, n_viirs: bigint, k_frp: double, k_count: double}
