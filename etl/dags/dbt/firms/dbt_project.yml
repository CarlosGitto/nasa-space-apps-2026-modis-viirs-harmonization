name: firms
version: "1.0.0"
profile: firms

model-paths: ["models"]
macro-paths: ["macros"]

# Two independent paths, selected by tag from Airflow (Cosmos):
#   nrt: lake.firms_raw.*_nrt -> lake.silver.*_nrt -> lake.gold.*_nrt   (firms_dbt_nrt)
#   sp:  lake.firms_raw.*_sp  -> lake.silver.*_sp  -> lake.gold.*_sp    (firms_dbt_sp)
#
# Everything lives in the DuckLake attached as `lake` (profiles.yml):
# - silver: incremental. Each run recomputes only the acquisition months that
#   received new loads in bronze (see macros/firms_silver.sql) and replaces
#   them atomically (delete+insert on acq_month, partitioned by acq_month).
#   `dbt run --full-refresh` rebuilds everything from bronze.
# - gold: views over silver (clean rows only), so they never need rebuilding.
models:
  firms:
    +database: lake
    nrt:
      +tags: [nrt]
      silver: &silver
        +schema: silver
        +materialized: incremental
        +incremental_strategy: delete+insert
        +unique_key: acq_month
        +partitioned_by: [acq_month]
      gold: &gold
        +schema: gold
        +materialized: view
    sp:
      +tags: [sp]
      silver: *silver
      gold: *gold
